# Phase 1 redesign pilot: coverage-gap TARGETS (match.pd rules never applied by
# the Phase 2 10k corpus, with GPT-4o hints validated against GCC's folding
# dumps) steer half of Phase 2's mutation batches.
#
# Same seeds (1990 regression tests) and engine settings as
# cpp_huf_saem_phase2_regression_10k.yaml, plus the engine v2 switches.
# Budget: 1990 seeds + 3000 mutants. Control: the first 4990 programs of the
# Phase 2 10k run (same seeds, untargeted mutants).
#
# Prerequisites (experiments/phase1_targets/):
#   python -m Fuzz4All.huf_saem.phase1_matchpd_targets --info <lcov of 10k run> --out matchpd_targets.jsonl
#   python -m Fuzz4All.huf_saem.phase1_target_hints --targets matchpd_targets.jsonl --out matchpd_hints.jsonl

fuzzing:
  output_folder: Results/cpp_huf_saem
  num: 4990              # 1990 seeds + 3000 mutants
  total_time: 24          # hours
  otf: true               # on-the-fly validation (required for Phase 4 coverage)
  resume: false
  evaluate: false
  use_hand_written_prompt: false
  no_input_prompt: true   # required for Ollama backends; auto_prompt() raises NotImplementedError otherwise
  prompt_strategy: 3
  log_level: 1

target:
  language: cpp
  path_documentation: config/documentation/cpp/cpp_23.md
  path_example_code: null
  path_hand_written_prompt: null
  trigger_to_generate_input: "// END OF DOCUMENTATION\n// BEGIN C++ PROGRAM"
  input_hint: "#include <bits/stdc++.h>"
  target_string: null

llm:
  temperature: 0.8
  batch_size: 5
  device: cuda
  model_name: ollama/deepseek-coder-v2
  max_length: 1024
  additional_eos_tokens: []

# --------------------------------------------------------------------------- #
# HUF-SAEM Architecture Configuration
# Phase 2 (regression_seeds) enabled; Phases 1, 3, 4 disabled.
# --------------------------------------------------------------------------- #
huf_saem:

  # Phase 1: Source-Aware Contextual Autoprompting
  # Scans compiler source, distills constraints via GPT-4o, injects into prompt.
  phase1:
    enabled: true
    mode: targets                  # redesign; "prompt_specs" = original Phase 1
    targets_file: experiments/phase1_targets/matchpd_targets.jsonl
    hints_file: experiments/phase1_targets/matchpd_hints.jsonl
    use_hints: validated           # only hints GCC confirmed (225)
    p_targeted: 0.5                # share of mutation batches that are targeted
    check_hits: true               # confirm each targeted mutant fires its rule

  # Phase 2: regression_seeds mode (see config/cpp_huf_saem.yaml for all keys)
  phase2:
    enabled: true
    mode: regression_seeds
    seed_manifest: experiments/phase2_regression_seeds/manifest.jsonl
    seed_dir: experiments/phase2_regression_seeds/seeds
    seed_classes: [run, compile]
    exclude_known_bugs: true
    max_seed_bytes: 4096
    mutate_ratio: 1.0   # pure mutation after the seeds, as in the pilot
    parent_mutant_ratio: 0.5
    max_similarity: 0.9
    operators: [retype, deepen, loops, merge, compute]
    rng_seed: 0
    # engine v2 switches
    prompt_version: 2
    retry_near_copies: true
    dedupe: true
    vary_sampling_seed: true
    log_rejected: true

  # Phase 3: Cloze-Masked Evolutionary Seed Preservation
  phase3:
    enabled: false
    window_size: 50
    cloze_threshold: 0.30
    mask_ratio: 0.15
    seed_db_path: null
    embedding_model: all-MiniLM-L6-v2
    islands:
      num_islands: 2
      biases:
        - memory_allocation
        - concurrency
      migration_interval: 50
      migration_fraction: 0.10
    cloze_model: gpt-4o

  # Phase 4: Active Constraint-Solving Feedback Loop
  phase4:
    enabled: false
    block_threshold: 10
    min_downstream_size: 5
    solver_interval: 100
    solver_model: gpt-4o
    gcov_binary: gcov
